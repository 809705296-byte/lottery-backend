<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拆盲盒 · 赢好礼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #1a1025;
    background: -webkit-linear-gradient(top, #2d1b3d, #0f0a1a);
    background: linear-gradient(180deg, #2d1b3d 0%, #0f0a1a 70%);
    background-attachment: fixed;
    color: #fff; min-height: 100vh;
    padding: 16px 16px 32px;
    font-size: 15px;
  }
  .app { max-width: 420px; margin: 0 auto; }
  .hero { text-align: center; margin-bottom: 20px; }
  .hero h1 {
    font-size: 26px; font-weight: 800; color: #ffd700;
    letter-spacing: 2px; cursor: pointer;
  }
  .hero p { color: #bbaacc; font-size: 13px; margin-top: 6px; }
  .stage {
    background: rgba(255,255,255,0.06);
    border-radius: 18px; padding: 20px 14px;
    border: 1px solid rgba(255,215,0,0.25);
  }
  .steps { display: flex; justify-content: space-around; margin-bottom: 22px; }
  .step { text-align: center; opacity: 0.35; transition: opacity 0.3s; flex: 1; }
  .step.active { opacity: 1; }
  .step i {
    display: block; width: 28px; height: 28px; line-height: 28px;
    border-radius: 50%; background: #ffd700; color: #1a1025;
    font-weight: bold; margin: 0 auto 4px; font-style: normal; font-size: 13px;
  }
  .step span { font-size: 11px; color: #ccbbdd; }
  .panel { text-align: center; }
  .qr-wrap {
    width: 190px; height: 190px; margin: 0 auto 12px;
    background: #fff; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .hint { font-size: 14px; color: #bbaacc; margin-bottom: 16px; line-height: 1.5; }
  .hint b { color: #ffd700; }
  .code-input {
    width: 100%; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,215,0,0.5);
    border-radius: 10px; color: #fff; padding: 12px;
    font-size: 16px; text-align: center; font-family: inherit;
    letter-spacing: 2px; margin-bottom: 14px;
  }
  .code-input:focus { outline: none; border-color: #ffd700; }
  .code-tip { font-size: 12px; color: #ff9f43; margin-top: 6px; }
  .btn {
    display: block; width: 100%; border: none;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #1a1025; font-weight: 700; font-size: 17px;
    padding: 14px; border-radius: 50px;
    box-shadow: 0 4px 14px rgba(255,215,0,0.3);
    cursor: pointer; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; }
  .btn-sec {
    background: rgba(255,215,0,0.12) !important;
    border: 1px solid #ffd700 !important;
    color: #ffd700 !important; box-shadow: none !important;
  }
  .btn-danger {
    background: rgba(255,80,80,0.15) !important;
    border: 1px solid #ff5050 !important;
    color: #ff5050 !important; box-shadow: none !important;
  }
  .btn-mini {
    background: rgba(255,215,0,0.2); border: 1px solid #ffd700;
    color: #ffd700; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; cursor: pointer; margin-left: 6px; font-family: inherit;
  }
  .copy-row {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-bottom: 16px; font-size: 14px; color: #ddccff;
  }
  .copy-row b { color: #ffd700; }
  .box-grid { display: flex; flex-wrap: wrap; margin: 10px -6px 0; }
  .box-item { position: relative; width: 50%; padding: 0 6px 12px; cursor: pointer; }
  .box-inner {
    width: 100%; height: 0; padding-bottom: 100%;
    border-radius: 16px; position: relative; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    background-size: cover; background-position: center;
  }
  .box-inner .bi-content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 10px;
  }
  .box-inner.has-image .bi-content { background: rgba(0,0,0,0.35); }
  .box-item:active .box-inner { transform: scale(0.95); }
  .box-item.shaking .box-inner { animation: shake 0.5s ease-in-out 2; }
  .box-inner .bi-emoji { font-size: 44px; line-height: 1; }
  .box-inner .bi-label { margin-top: 6px; font-size: 13px; font-weight: 600; }
  @keyframes shake {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  .open-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center; z-index: 150;
  }
  .open-box {
    width: 60vw; max-width: 220px; height: 60vw; max-height: 220px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 70px; box-shadow: 0 0 40px rgba(255,215,0,0.4);
    overflow: hidden; background-size: cover; background-position: center;
  }
  .open-box img { max-width: 80%; max-height: 80%; border-radius: 10px; }
  .open-box.opened { animation: pop 0.5s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1.1); }
  }
  .prize-card {
    background: rgba(255,255,255,0.06); border-radius: 16px;
    padding: 20px 16px; border: 1px solid rgba(255,215,0,0.3);
    margin-bottom: 16px;
  }
  .prize-card .pc-emoji {
    font-size: 70px; line-height: 1; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
    min-height: 80px;
  }
  .prize-card .pc-emoji img { max-width: 100%; max-height: 180px; border-radius: 10px; }
  .prize-card .pc-name { font-size: 20px; color: #ffd700; font-weight: 700; margin-bottom: 6px; }
  .prize-card .pc-desc { font-size: 13px; color: #bbaacc; margin-bottom: 10px; }
  .prize-card .pc-time { font-size: 12px; color: #887799; }
  .verify-area { margin-top: 10px; }
  .verify-slider {
    position: relative; height: 52px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.4);
    border-radius: 26px; overflow: hidden; margin: 0 0 8px;
  }
  .vs-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 52px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 26px; pointer-events: none;
  }
  .vs-label {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #ccbbdd; letter-spacing: 2px; pointer-events: none;
  }
  .vs-thumb {
    position: absolute; left: 4px; top: 4px;
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #fff, #ffd700);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #1a1025; font-weight: bold;
    box-shadow: 0 2px 8px rgba(255,215,0,0.5); cursor: grab;
  }
  .vs-thumb.done { background: #10b981; color: #fff; }
  .verify-tip { font-size: 11px; color: #887799; line-height: 1.5; }
  .verify-tip b { color: #ff9f43; }
  .verified-badge {
    background: rgba(16,185,129,0.15); border: 1px solid #10b981;
    border-radius: 12px; padding: 12px; margin-top: 10px; text-align: center;
  }
  .verified-badge .vb-title { font-size: 15px; color: #6bffb8; font-weight: 700; margin-bottom: 4px; }
  .verified-badge .vb-time { font-size: 11px; color: #66aa88; }
  .block-wrap { padding: 20px 10px; }
  .block-icon { font-size: 60px; margin-bottom: 16px; }
  .block-title { font-size: 20px; color: #ffd700; font-weight: 700; margin-bottom: 10px; }
  .block-msg { font-size: 14px; color: #bbaacc; line-height: 1.7; margin-bottom: 16px; }
  .block-extra {
    font-size: 12px; color: #887799; line-height: 1.6;
    background: rgba(0,0,0,0.3); border-radius: 10px;
    padding: 12px; margin-top: 12px;
  }
  .rule { margin-top: 24px; font-size: 12px; color: #887799; line-height: 1.8; }
  .rule h3 { color: #ffd700; font-size: 14px; margin-bottom: 6px; }
  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 99; padding: 16px;
  }
  .modal-card {
    background: #2d1b3d; border: 2px solid #ffd700; border-radius: 20px;
    padding: 28px 22px; max-width: 320px; width: 100%; text-align: center;
    max-height: 88vh; overflow-y: auto;
  }
  .result-img {
    font-size: 60px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; min-height: 70px;
  }
  .result-img img { max-width: 100%; max-height: 180px; border-radius: 10px; }
  .modal-card h2 { font-size: 22px; color: #ffd700; margin-bottom: 8px; }
  .modal-card p { font-size: 14px; color: #bbaacc; margin-bottom: 18px; line-height: 1.6; }
  .result-tip { font-size: 11px; color: #887799; margin-top: 10px; }
  .pwd-input {
    width: 100%; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 10px; color: #fff; padding: 12px;
    font-size: 16px; text-align: center; margin-bottom: 12px; font-family: inherit;
  }
  .modal-card .btn { margin-top: 8px; }
  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px;
    border-radius: 30px; font-size: 13px; z-index: 999;
    max-width: 88vw; text-align: center; word-break: break-all;
  }
  [hidden] { display: none !important; }
  .admin-fab {
    position: fixed; right: 14px; bottom: 14px;
    width: 46px; height: 46px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.5);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #ffd700;
    z-index: 90; cursor: pointer; opacity: 0.5;
  }
  .admin-fab:active { opacity: 1; }
  .admin {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #150f20; z-index: 200;
    overflow-y: auto; padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .admin-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .admin-head h2 { font-size: 18px; color: #ffd700; }
  .admin-head button {
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    padding: 8px 14px; border-radius: 20px; font-size: 13px; font-family: inherit;
  }
  .admin section {
    background: rgba(255,255,255,0.05); border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
    border: 1px solid rgba(255,215,0,0.18);
  }
  .admin h3 { font-size: 14px; color: #ffd700; margin-bottom: 8px; }
  .admin label { display: block; font-size: 12px; color: #bbaacc; margin: 8px 0 4px; }
  .admin input, .admin textarea {
    width: 100%; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 8px; color: #fff; padding: 8px; font-size: 16px;
    font-family: inherit;
  }
  .admin input[type="file"] {
    font-size: 12px; padding: 6px;
    background: rgba(255,215,0,0.08);
    border: 1px dashed rgba(255,215,0,0.4);
  }
  .admin textarea { font-size: 12px; height: 100px; margin-top: 8px; }
  .admin .btn { font-size: 15px; padding: 12px; margin-top: 8px; }
  .admin .info-box {
    background: rgba(255,215,0,0.08);
    border: 1px dashed rgba(255,215,0,0.35);
    border-radius: 8px; padding: 10px;
    font-size: 11px; color: #bbaacc; line-height: 1.6; margin-top: 8px;
  }
  .admin .info-box b { color: #ffd700; }
  .prize-row {
    background: rgba(255,255,255,0.05); border-radius: 8px;
    padding: 10px; margin-bottom: 8px;
  }
  .prize-row .pr-r1 { display: flex; gap: 6px; margin-bottom: 6px; }
  .prize-row .pr-r1 input:first-child { width: 44px; text-align: center; }
  .prize-row .pr-r2 {
    display: flex; gap: 6px; align-items: center;
    font-size: 11px; color: #bbaacc; flex-wrap: wrap; margin-bottom: 6px;
  }
  .prize-row .pr-r2 input { width: 80px; padding: 5px; font-size: 15px; }
  .prize-row .pr-r2 .prob { color: #ffd700; min-width: 60px; }
  .prize-row .pr-r3 { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .prize-row .pr-r3 input { flex: 1; }
  .prize-row .del {
    background: rgba(255,80,80,0.15); border: 1px solid #ff5050; color: #ff5050;
    border-radius: 8px; padding: 4px 10px; font-size: 11px;
    cursor: pointer; width: auto; font-family: inherit;
  }
  .prize-row .pr-r4 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 6px; padding-top: 8px;
    border-top: 1px dashed rgba(255,215,0,0.15);
  }
  .prize-row .pr-r4 .p-img-label { font-size: 11px; color: #bbaacc; flex: 0 0 auto; }
  .prize-row .p-img-file {
    font-size: 11px; padding: 4px 6px;
    background: rgba(255,215,0,0.08);
    border: 1px dashed rgba(255,215,0,0.4);
    border-radius: 6px; color: #bbaacc; max-width: 120px; flex: 0 0 auto;
  }
  .prize-row .p-img-preview { flex: 1; min-width: 50px; display: flex; align-items: center; }
  .prize-row .p-img-preview img {
    max-width: 60px; max-height: 60px; border-radius: 4px;
    border: 1px solid rgba(255,215,0,0.3);
  }
  .prize-row .p-img-preview .no-img { font-size: 10px; color: #665577; }
  .prize-row .p-img-clear {
    background: rgba(255,80,80,0.15); border: 1px solid #ff5050; color: #ff5050;
    border-radius: 6px; padding: 4px 8px; font-size: 10px;
    cursor: pointer; flex: 0 0 auto; font-family: inherit;
  }
  .rec-item {
    font-size: 12px; color: #ccbbdd; padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08); line-height: 1.6;
  }
  .rec-item b { color: #ffd700; }
  .rec-item .ri-row { display: flex; justify-content: space-between; align-items: center; }
  .rec-item .ri-status {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px;
  }
  .rec-item .ri-status.yes { background: rgba(16,185,129,0.2); color: #6bffb8; }
  .rec-item .ri-status.no  { background: rgba(255,159,67,0.2); color: #ff9f43; }
  .rec-item .ri-btn {
    background: rgba(255,215,0,0.15); border: 1px solid #ffd700; color: #ffd700;
    padding: 3px 10px; border-radius: 10px; font-size: 10px; cursor: pointer;
    margin-top: 4px; font-family: inherit;
  }
  .rec-item .ri-btn.undo { border-color: #ff5050; color: #ff5050; background: rgba(255,80,80,0.1); }
  .empty { color: #665577; font-size: 12px; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1 id="heroTitle">拆盲盒 · 赢好礼</h1>
    <p id="heroSubtitle">添加销售微信，即可参与抽奖</p>
  </div>

  <div class="stage">
    <div class="steps" id="stepsBar">
      <div class="step active" data-step="1"><i>1</i><span>添加销售</span></div>
      <div class="step" data-step="2"><i>2</i><span>选择盲盒</span></div>
    </div>

    <div class="panel" id="panel-1">
      <div class="qr-wrap" id="qrWrap">
        <img id="salesQR" alt="销售微信二维码" style="display:none">
        <div id="qrFallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1a1025;padding:10px">
          <div style="font-size:12px;color:#666;margin-bottom:6px">请到微信搜索添加</div>
          <div style="font-size:22px;font-weight:900;color:#1a1025;word-break:break-all;text-align:center" id="qrFallbackId">sales_test</div>
        </div>
      </div>
      <p class="hint">扫码或长按识别添加销售微信</p>
      <div class="copy-row">
        <span>微信号：<b id="salesIdDisplay">sales_test</b></span>
        <button class="btn-mini" id="copyBtn">复制</button>
      </div>
      <button class="btn" id="goStep2Btn">我已添加，去选盲盒</button>
    </div>

    <div class="panel" id="panel-2" hidden>
      <p class="hint">从下面挑选一个盲盒，<b>只有一次机会</b>哦~</p>
      <div class="box-grid" id="boxGrid"></div>
    </div>

    <div class="panel" id="panel-done" hidden>
      <div class="prize-card">
        <div class="pc-emoji" id="doneEmoji">🎁</div>
        <div class="pc-name" id="doneName"></div>
        <div class="pc-desc" id="doneDesc"></div>
        <div class="pc-time" id="doneTime"></div>
      </div>
      <div class="verify-area" id="verifyArea">
        <div class="verify-slider" id="verifySlider">
          <div class="vs-fill" id="vsFill"></div>
          <span class="vs-label" id="vsLabel">滑动核销 →</span>
          <div class="vs-thumb" id="vsThumb">→</div>
        </div>
        <p class="verify-tip">请<b>工作人员</b>滑动上方滑块完成核销</p>
      </div>
      <div class="verified-badge" id="verifiedBadge" hidden>
        <div class="vb-title">✓ 已核销</div>
        <div class="vb-time" id="verifiedTime"></div>
      </div>
    </div>

    <div class="panel" id="panel-block" hidden>
      <div class="block-wrap">
        <div class="block-icon" id="blockIcon">🔒</div>
        <div class="block-title" id="blockTitle">活动不可用</div>
        <div class="block-msg" id="blockMsg"></div>
        <div class="block-extra" id="blockExtra"></div>
      </div>
    </div>
  </div>

  <div class="rule">
    <h3>活动规则</h3>
    <p id="ruleText"></p>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="result-img" id="resultImg">🎁</div>
    <h2 id="resultName"></h2>
    <p id="resultDesc"></p>
    <button class="btn" id="modalCloseBtn">知道了</button>
    <p class="result-tip" id="resultTip"></p>
  </div>
</div>

<div class="modal" id="pwdModal" hidden>
  <div class="modal-card">
    <h2>后台验证</h2>
    <p>请输入后台密码</p>
    <input class="pwd-input" id="pwdInput" type="password" placeholder="密码" autocomplete="off">
    <button class="btn" id="pwdOkBtn">进入后台</button>
    <button class="btn btn-sec" id="pwdCancelBtn">取消</button>
  </div>
</div>

<div class="admin" id="admin" hidden>
  <div class="admin-head">
    <h2>活动后台</h2>
    <button id="adminCloseBtn">关闭</button>
  </div>

  <section>
    <h3>基础设置</h3>
    <label>销售微信号</label>
    <input id="cfgSalesId">
    <label>销售微信二维码图片</label>
    <input type="file" id="cfgQRFile" accept="image/*">
    <div id="qrPreview" style="margin-top:8px;text-align:center"></div>
    <button class="btn btn-sec" id="clearQRBtn">清除二维码图片</button>
    <label>后台密码</label>
    <input id="cfgPwd">
    <label>活动规则文案（支持 &lt;br&gt; 换行）</label>
    <textarea id="cfgRule"></textarea>
    <button class="btn" id="saveBaseBtn">保存基础设置</button>
  </section>

  <section>
    <h3>奖品配置（全局共用）</h3>
    <div class="info-box">
      填写你计划的<b>预计参与人数</b>和每个奖品的<b>发放数量</b>，系统自动算出中奖概率。<br>
      6个盲盒共用这一套奖品池，用户选哪个盒子都一样。
    </div>
    <label>预计参与人数</label>
    <input id="cfgTotalUsers" type="number" placeholder="例如 1000">
    <div id="prizeEditor" style="margin-top:8px"></div>
    <button class="btn btn-sec" id="addPrizeBtn">+ 添加奖品</button>
    <button class="btn" id="savePrizesBtn">保存奖品配置</button>
  </section>

  <section>
    <h3>参与者名单（<span id="recCount">0</span> 人）</h3>
    <div id="recordList"></div>
    <button class="btn btn-sec" id="refreshRecBtn">刷新名单</button>
  </section>

  <section>
    <h3>本机测试</h3>
    <p style="font-size:11px;color:#887799;margin-bottom:8px">
      当前设备指纹：<br><b id="myDeviceId" style="color:#ffd700;font-size:10px"></b>
    </p>
    <button class="btn btn-sec" id="resetMeBtn">重置本机抽奖状态</button>
  </section>
</div>

<div class="admin-fab" id="adminFab">⚙️</div>
<div class="toast" id="toast" hidden></div>

<script>
(function() {
  'use strict';

  var API_BASE = 'https://before.githubpage.com';

  var KEY_ME = 'lottery_me_v8';
  var KEY_CFG_LOCAL = 'lottery_cfg_local_v8';

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    if (t._timer) clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.hidden = true; }, 1800);
  }

  function setPanel(id) {
    var ids = ['panel-1', 'panel-2', 'panel-done', 'panel-block'];
    for (var i = 0; i < ids.length; i++) {
      $(ids[i]).hidden = (ids[i] !== id);
    }
  }

  function getDeviceId() {
    try {
      var raw = [
        navigator.userAgent || '',
        navigator.language || '',
        navigator.platform || '',
        screen.width + 'x' + screen.height,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '',
        navigator.maxTouchPoints || ''
      ].join('|');
      var hash = 0;
      for (var i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return 'D' + Math.abs(hash).toString(36).toUpperCase();
    } catch (e) {
      return 'D' + Math.random().toString(36).slice(2, 10).toUpperCase();
    }
  }

  var DEVICE_ID = getDeviceId();
  var ME = null;
  var step = 1;
  var drawing = false;
  var sliderReady = false;
  var CFG = {
    salesId: 'sales_test',
    salesQRImage: '',
    password: 'akd123456',
    rule: '1. 添加销售微信后可参与抽奖。<br>2. 每人限选一个盲盒，限抽一次。<br>3. 中奖后请截图联系销售领取。',
    boxes: [],
    totalUsers: 1000,
    prizes: []
  };

  function loadMe() {
    try { return JSON.parse(localStorage.getItem(KEY_ME) || 'null'); }
    catch (e) { return null; }
  }
  function saveMe(m) {
    try { localStorage.setItem(KEY_ME, JSON.stringify(m)); } catch (e) {}
  }

  function loadLocalCfg() {
    try {
      var s = localStorage.getItem(KEY_CFG_LOCAL);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }
  function saveLocalCfg(c) {
    try { localStorage.setItem(KEY_CFG_LOCAL, JSON.stringify(c)); } catch (e) {}
  }

  function renderPrizeVisual(el, prize) {
    if (prize && prize.image) {
      el.innerHTML = '<img src="' + prize.image + '" alt="">';
    } else {
      el.textContent = (prize && prize.emoji) || '🎁';
    }
  }

  function renderSalesQR() {
    var img = $('salesQR');
    var fallback = $('qrFallback');
    var fallbackId = $('qrFallbackId');
    fallbackId.textContent = CFG.salesId || '';
    if (CFG.salesQRImage) {
      img.src = CFG.salesQRImage;
      img.style.display = 'block';
      fallback.style.display = 'none';
    } else {
      img.style.display = 'none';
      fallback.style.display = 'flex';
    }
  }

  function renderQRPreview() {
    var box = $('qrPreview');
    if (CFG.salesQRImage) {
      box.innerHTML = '<img src="' + CFG.salesQRImage + '" style="max-width:120px;border-radius:8px">';
    } else {
      box.innerHTML = '<div style="font-size:11px;color:#887799">未上传</div>';
    }
  }

  // 6个盒子外观（用户不可改，写死）
  function getBoxAppearance() {
    return [
      { name: '1号盲盒', emoji: '🎁', color: '#ff6b6b' },
      { name: '2号盲盒', emoji: '🎀', color: '#4ecdc4' },
      { name: '3号盲盒', emoji: '🎊', color: '#ffd93d' },
      { name: '4号盲盒', emoji: '🎉', color: '#a29bfe' },
      { name: '5号盲盒', emoji: '🎈', color: '#ff9f43' },
      { name: '6号盲盒', emoji: '🧧', color: '#ff6b81' }
    ];
  }

  function renderBoxGrid() {
    var grid = $('boxGrid');
    grid.innerHTML = '';
    var boxes = getBoxAppearance();
    for (var i = 0; i < boxes.length; i++) {
      (function(idx) {
        var box = boxes[idx];
        var wrap = document.createElement('div');
        wrap.className = 'box-item';
        var inner = document.createElement('div');
        inner.className = 'box-inner';
        inner.style.background = 'linear-gradient(160deg, ' + box.color + ' 0%, #1a1025 130%)';
        var content = document.createElement('div');
        content.className = 'bi-content';
        content.innerHTML =
          '<div class="bi-emoji">' + esc(box.emoji) + '</div>' +
          '<div class="bi-label">' + esc(box.name) + '</div>';
        inner.appendChild(content);
        wrap.appendChild(inner);
        wrap.onclick = function() { selectBox(idx, wrap); };
        grid.appendChild(wrap);
      })(i);
    }
  }

  function findMyRecord() {
    return null;
  }

  function renderDonePage() {
    if (!ME) return;
    renderPrizeVisual($('doneEmoji'), ME.prize);
    $('doneName').textContent = (ME.prize && ME.prize.name) || '';
    $('doneDesc').textContent = (ME.prize && ME.prize.desc) || '';
    $('doneTime').textContent = ME.time ? ('中奖时间：' + ME.time) : '';

    var isLose = ME.prize && /谢谢|未中奖/.test(ME.prize.name || '');
    var area = $('verifyArea');
    var badge = $('verifiedBadge');

    if (isLose) {
      area.hidden = true;
      badge.hidden = true;
    } else if (ME.verified) {
      area.hidden = true;
      badge.hidden = false;
      $('verifiedTime').textContent = '核销时间：' + (ME.verifiedTime || '');
    } else {
      area.hidden = false;
      badge.hidden = true;
      sliderReady = false;
      setTimeout(setupVerifySlider, 60);
    }
  }

  function setupVerifySlider() {
    if (sliderReady) return;
    var container = $('verifySlider');
    if (!container || container.offsetWidth === 0) return;
    sliderReady = true;

    var thumb = $('vsThumb');
    var fill = $('vsFill');
    var label = $('vsLabel');

    thumb.style.transform = 'translateX(0)';
    thumb.textContent = '→';
    thumb.className = 'vs-thumb';
    fill.style.width = '52px';
    label.style.opacity = '1';

    var maxX = 0, startX = 0, currentX = 0, dragging = false, done = false;

    function updateMax() {
      maxX = container.offsetWidth - thumb.offsetWidth - 8;
      if (maxX < 10) maxX = 10;
    }
    function setX(x) {
      if (x < 0) x = 0;
      if (x > maxX) x = maxX;
      currentX = x;
      thumb.style.transform = 'translateX(' + x + 'px)';
      var ratio = maxX ? x / maxX : 0;
      fill.style.width = (thumb.offsetWidth + x) + 'px';
      label.style.opacity = String(Math.max(0, 1 - ratio * 2.2));
    }
    function getCx(e) {
      if (e.touches && e.touches.length) return e.touches[0].clientX;
      if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
      return e.clientX;
    }
    function onDown(e) {
      if (done) return;
      dragging = true; updateMax();
      startX = getCx(e) - currentX;
    }
    function onMove(e) {
      if (!dragging || done) return;
      setX(getCx(e) - startX);
      if (e.cancelable) e.preventDefault();
    }
    function onUp() {
      if (!dragging || done) return;
      dragging = false;
      if (currentX >= maxX * 0.85) {
        done = true; setX(maxX);
        thumb.className = 'vs-thumb done';
        thumb.textContent = '✓';
        label.style.opacity = '0';
        setTimeout(doVerify, 200);
      } else {
        setX(0);
      }
    }

    container.addEventListener('touchstart', onDown, { passive: true });
    container.addEventListener('touchmove', onMove, { passive: false });
    container.addEventListener('touchend', onUp);
    container.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  function doVerify() {
    if (!ME) return;
    ME.verified = true;
    ME.verifiedTime = new Date().toLocaleString('zh-CN');
    saveMe(ME);
    renderDonePage();
    showToast('核销成功');
  }

  function showResult(prize) {
    renderPrizeVisual($('resultImg'), prize);
    $('resultName').textContent = prize.name || '';
    $('resultDesc').textContent = prize.desc || '';
    var lose = /谢谢|未中奖/.test(prize.name || '');
    $('resultTip').textContent = lose ? '' : '请到销售处凭此页核销领取奖品';
    $('modal').hidden = false;
  }

  function selectBox(idx, el) {
    if (drawing || ME) return;
    if (step < 2) return;
    drawing = true;
    var items = document.querySelectorAll('.box-item');
    for (var i = 0; i < items.length; i++) items[i].style.pointerEvents = 'none';
    el.classList.add('shaking');
    setTimeout(function() {
      el.classList.remove('shaking');
      doOpenBox(idx);
    }, 900);
  }

  function doOpenBox(idx) {
    var boxes = getBoxAppearance();
    var box = boxes[idx];

    fetch(API_BASE + '/draw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fingerprint: DEVICE_ID })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (!data.ok) {
        showToast(data.msg || '抽奖失败');
        drawing = false;
        return;
      }
      var prize = data.prize;

      var overlay = document.createElement('div');
      overlay.className = 'open-overlay';
      var boxEl = document.createElement('div');
      boxEl.className = 'open-box';
      boxEl.style.background = 'linear-gradient(160deg, ' + box.color + ' 0%, #1a1025 130%)';
      boxEl.textContent = box.emoji;
      overlay.appendChild(boxEl);
      document.body.appendChild(overlay);

      setTimeout(function() {
        boxEl.className = 'open-box opened';
        if (prize.image) {
          boxEl.innerHTML = '<img src="' + prize.image + '" alt="">';
        } else {
          boxEl.textContent = prize.emoji || '🎁';
        }

        ME = {
          prize: prize,
          time: new Date().toLocaleString('zh-CN'),
          verified: false,
          verifiedTime: null
        };
        saveMe(ME);

        setTimeout(function() {
          if (overlay.parentNode) document.body.removeChild(overlay);
          showResult(prize);
          $('stepsBar').hidden = true;
          renderDonePage();
          setPanel('panel-done');
        }, 700);
      }, 1100);
    })
    ['catch'](function(err) {
      showToast('网络错误：' + err);
      drawing = false;
    });
  }

  function goStep(n) {
    step = n;
    setPanel('panel-' + n);
    var steps = document.querySelectorAll('.step');
    for (var i = 0; i < steps.length; i++) {
      steps[i].className = (i + 1 <= n) ? 'step active' : 'step';
    }
  }

  function copySalesId() {
    var text = CFG.salesId;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('已复制');
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('已复制'); } catch(e) {}
      document.body.removeChild(ta);
    }
  }

  // ====== 后台 ======
  function openPwd() {
    $('pwdInput').value = '';
    $('pwdModal').hidden = false;
  }

  function tryOpenAdmin() {
    var val = ($('pwdInput').value || '').trim();
    if (val === CFG.password) {
      $('pwdModal').hidden = true;
      openAdmin();
    } else {
      showToast('密码错误');
    }
  }

  function openAdmin() {
    $('cfgSalesId').value = CFG.salesId;
    $('cfgPwd').value = CFG.password;
    $('cfgRule').value = CFG.rule;
    $('cfgTotalUsers').value = CFG.totalUsers || 1000;
    renderQRPreview();
    renderPrizeEditor();
    loadRecordsFromServer();
    $('myDeviceId').textContent = DEVICE_ID;
    $('admin').hidden = false;
  }

  function closeAdmin() {
    $('admin').hidden = true;
    renderSalesQR();
    $('ruleText').innerHTML = CFG.rule;
  }

  function renderPrizeEditor() {
    var wrap = $('prizeEditor');
    wrap.innerHTML = '';
    var prizes = CFG.prizes || [];
    var totalUsers = Number($('cfgTotalUsers').value) || CFG.totalUsers || 1000;

    for (var i = 0; i < prizes.length; i++) {
      (function(idx) {
        var p = prizes[idx];
        var row = document.createElement('div');
        row.className = 'prize-row';
        row.setAttribute('data-image', p.image || '');
        var prob = ((Number(p.count) || 0) / totalUsers * 100).toFixed(2);
        row.innerHTML =
          '<div class="pr-r1">' +
            '<input class="p-emoji" value="' + esc(p.emoji || '🎁') + '">' +
            '<input class="p-name" value="' + esc(p.name || '') + '">' +
          '</div>' +
          '<div class="pr-r2">' +
            '<span>数量</span><input type="number" class="p-count" value="' + (p.count || 0) + '">' +
            '<span class="prob">≈ ' + prob + '%</span>' +
            '<button class="del" type="button">删除</button>' +
          '</div>' +
          '<div class="pr-r3">' +
            '<input class="p-desc" value="' + esc(p.desc || '') + '" placeholder="中奖描述">' +
          '</div>' +
          '<div class="pr-r4">' +
            '<span class="p-img-label">图片</span>' +
            '<input type="file" class="p-img-file" accept="image/*">' +
            '<div class="p-img-preview"></div>' +
            '<button class="p-img-clear" type="button">清除</button>' +
          '</div>';
        wrap.appendChild(row);

        renderPrizeImgPreview(row);

        row.querySelector('.p-count').oninput = function() {
          var t = Number($('cfgTotalUsers').value) || 1;
          var c = Number(this.value) || 0;
          row.querySelector('.prob').textContent = '≈ ' + (c / t * 100).toFixed(2) + '%';
        };

        row.querySelector('.del').onclick = function() {
          row.parentNode.removeChild(row);
        };

        row.querySelector('.p-img-file').onchange = function(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          if (file.size > 300 * 1024) { showToast('图片不超过 300KB'); return; }
          var reader = new FileReader();
          reader.onload = function(ev) {
            row.setAttribute('data-image', ev.target.result);
            renderPrizeImgPreview(row);
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };

        row.querySelector('.p-img-clear').onclick = function() {
          row.setAttribute('data-image', '');
          renderPrizeImgPreview(row);
        };
      })(i);
    }
  }

  function renderPrizeImgPreview(row) {
    var box = row.querySelector('.p-img-preview');
    var img = row.getAttribute('data-image');
    if (img) {
      box.innerHTML = '<img src="' + img + '">';
    } else {
      box.innerHTML = '<span class="no-img">未上传</span>';
    }
  }

  function collectPrizes() {
    var wrap = $('prizeEditor');
    var rows = wrap.querySelectorAll('.prize-row');
    var prizes = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      prizes.push({
        name: (row.querySelector('.p-name').value || '').trim() || '奖品',
        emoji: (row.querySelector('.p-emoji').value || '').trim() || '🎁',
        count: Number(row.querySelector('.p-count').value) || 0,
        desc: (row.querySelector('.p-desc').value || '').trim(),
        image: row.getAttribute('data-image') || ''
      });
    }
    return prizes;
  }

  function savePrizesConfig() {
    CFG.totalUsers = Number($('cfgTotalUsers').value) || 1000;
    CFG.prizes = collectPrizes();

    fetch(API_BASE + '/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ totalUsers: CFG.totalUsers, prizes: CFG.prizes })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.ok) {
        showToast('奖品配置已保存到服务器');
      } else {
        showToast('保存失败：' + (data.error || ''));
      }
    })
    ['catch'](function(err) { showToast('网络错误'); });
  }

  function saveBaseConfig() {
    CFG.salesId = ($('cfgSalesId').value || '').trim() || 'sales_test';
    CFG.password = ($('cfgPwd').value || '').trim() || 'akd123456';
    CFG.rule = ($('cfgRule').value || '').trim() || CFG.rule;
    saveLocalCfg({ salesId: CFG.salesId, password: CFG.password, rule: CFG.rule });
    renderSalesQR();
    $('ruleText').innerHTML = CFG.rule;
    showToast('基础设置已保存（本机）');
  }

  function loadRecordsFromServer() {
    fetch(API_BASE + '/records')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var rec = data.records || [];
      $('recCount').textContent = rec.length;
      var wrap = $('recordList');
      if (!rec.length) {
        wrap.innerHTML = '<div class="empty">暂无记录</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < rec.length; i++) {
        var r = rec[i];
        html += '<div class="rec-item">' +
          '<div class="ri-row"><span>#' + (i+1) + ' · ' + esc(r.time) + '</span>' +
          '<span class="ri-status ' + (r.verified ? 'yes' : 'no') + '">' +
          (r.verified ? '已核销' : '未核销') + '</span></div>' +
          '<div><b>' + esc(r.prize) + '</b></div>' +
          '<div style="font-size:10px;color:#776688">' + esc((r.fingerprint || '').slice(0,12)) + '...</div>' +
        '</div>';
      }
      wrap.innerHTML = html;
    })
    ['catch'](function() { showToast('读取名单失败'); });
  }

  function onQRFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) { showToast('图片不超过 500KB'); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      CFG.salesQRImage = ev.target.result;
      saveLocalCfg({ salesId: CFG.salesId, password: CFG.password, rule: CFG.rule, salesQRImage: CFG.salesQRImage });
      renderQRPreview();
      renderSalesQR();
      showToast('二维码已上传');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function init() {
    var local = loadLocalCfg();
    if (local) {
      if (local.salesId) CFG.salesId = local.salesId;
      if (local.password) CFG.password = local.password;
      if (local.rule) CFG.rule = local.rule;
      if (local.salesQRImage) CFG.salesQRImage = local.salesQRImage;
    }

    ME = loadMe();

    $('salesIdDisplay').textContent = CFG.salesId;
    $('ruleText').innerHTML = CFG.rule;
    $('myDeviceId').textContent = DEVICE_ID;

    // 从服务器读奖品配置
    fetch(API_BASE + '/config')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.ok && data.config) {
        CFG.totalUsers = data.config.totalUsers || 1000;
        CFG.prizes = data.config.prizes || [];
      }
    })['catch'](function() {});

    if (ME) {
      $('stepsBar').hidden = true;
      renderDonePage();
      setPanel('panel-done');
    } else {
      setPanel('panel-1');
    }
    renderBoxGrid();
    renderSalesQR();

    // 事件绑定
    $('goStep2Btn').onclick = function() { goStep(2); };
    $('copyBtn').onclick = copySalesId;
    $('modalCloseBtn').onclick = function() { $('modal').hidden = true; };
    $('adminFab').onclick = openPwd;
    $('pwdOkBtn').onclick = tryOpenAdmin;
    $('pwdCancelBtn').onclick = function() { $('pwdModal').hidden = true; };
    $('adminCloseBtn').onclick = closeAdmin;
    $('cfgQRFile').onchange = onQRFileChange;
    $('clearQRBtn').onclick = function() {
      CFG.salesQRImage = '';
      saveLocalCfg({ salesId: CFG.salesId, password: CFG.password, rule: CFG.rule, salesQRImage: '' });
      renderQRPreview();
      renderSalesQR();
    };
    $('saveBaseBtn').onclick = saveBaseConfig;
    $('addPrizeBtn').onclick = function() {
      CFG.prizes = collectPrizes();
      CFG.prizes.push({ name:'新奖品', emoji:'🎁', count:10, desc:'恭喜中奖！', image:'' });
      renderPrizeEditor();
    };
    $('savePrizesBtn').onclick = savePrizesConfig;
    $('refreshRecBtn').onclick = loadRecordsFromServer;
    $('resetMeBtn').onclick = function() {
      if (!confirm('重置后本机可再抽一次，确定？')) return;
      localStorage.removeItem(KEY_ME);
      ME = null; drawing = false; step = 1;
      $('stepsBar').hidden = false;
      var steps = document.querySelectorAll('.step');
      for (var i = 0; i < steps.length; i++) {
        steps[i].className = (i === 0) ? 'step active' : 'step';
      }
      setPanel('panel-1');
      closeAdmin();
      showToast('已重置');
    };
    $('cfgTotalUsers').oninput = function() {
      renderPrizeEditor();
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
